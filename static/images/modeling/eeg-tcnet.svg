<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">EEG-TCNet architecture</title><desc id="d">An EEGNet front end feeds causal dilated temporal convolution blocks.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#281038"/><stop offset="1" stop-color="#663067"/></linearGradient><style>.h{font:700 38px system-ui;fill:white}.s{font:20px system-ui;fill:#f4d8ff}.n{font:600 18px system-ui;fill:white}.x{fill:#51255d;stroke:#e0a4ff;stroke-width:2}.a{stroke:#e0a4ff;stroke-width:4;marker-end:url(#m)}.f{font:15px system-ui;fill:#dfbde9}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#e0a4ff"/></marker></defs><rect width="1200" height="500" rx="24" fill="url(#b)"/><text class="h" x="60" y="70">EEG-TCNet</text><text class="s" x="60" y="105">Compact EEG features followed by causal temporal memory</text><g transform="translate(60 190)"><rect class="x" width="150" height="115" rx="17"/><text class="n" x="36" y="64">EEG trial</text><path class="a" d="M150 58H220"/><rect class="x" x="220" width="230" height="115" rx="17"/><text class="n" x="268" y="48">EEGNet front end</text><text class="s" x="260" y="82">spectral + spatial</text><path class="a" d="M450 58H520"/><rect class="x" x="520" width="400" height="115" rx="17"/><text class="n" x="624" y="38">Residual TCN</text><rect class="x" x="550" y="56" width="95" height="40" rx="10"/><rect class="x" x="673" y="56" width="95" height="40" rx="10"/><rect class="x" x="796" y="56" width="95" height="40" rx="10"/><text class="s" x="575" y="83">d=1</text><text class="s" x="698" y="83">d=2</text><text class="s" x="821" y="83">d=4</text><path class="a" d="M920 58H990"/><rect class="x" x="990" width="150" height="115" rx="17"/><text class="n" x="1018" y="64">Classifier</text></g><text class="f" x="60" y="458">Architecture redrawn from Ingolfsson et al., EEG-TCNet (2020), arXiv:2006.00622</text></svg>
