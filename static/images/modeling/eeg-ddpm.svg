<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">EEG diffusion process</title><desc id="d">Clean EEG is progressively noised and a time-conditioned network learns the reverse process.</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#302008"/><stop offset="1" stop-color="#75451b"/></linearGradient><style>.h{font:700 38px system-ui;fill:#fff}.s{font:20px system-ui;fill:#ffebc3}.n{font:600 18px system-ui;fill:#fff}.x{fill:#614019;stroke:#ffc56e;stroke-width:2}.a{stroke:#ffc56e;stroke-width:4;marker-end:url(#m)}.r{stroke:#ff9270;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#r)}.f{font:15px system-ui;fill:#ebcca1}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#ffc56e"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#ff9270"/></marker></defs><rect width="1200" height="500" rx="24" fill="url(#b)"/><text class="h" x="60" y="70">DDPM for EEG</text><text class="s" x="60" y="105">Learn the reverse of a gradual Gaussian corruption process</text><g transform="translate(70 175)"><rect class="x" width="180" height="100" rx="16"/><text class="n" x="44" y="45">clean EEG x₀</text><path d="M25 70q18-28 36 0t36 0 36 0 36 0" fill="none" stroke="#ffc56e" stroke-width="3"/><path class="a" d="M180 50H300"/><rect class="x" x="300" width="180" height="100" rx="16"/><text class="n" x="338" y="45">noisy EEG xₜ</text><path d="M325 70l15-25 14 37 15-20 14 25 16-39 17 30 16-14 18 20" fill="none" stroke="#ffc56e" stroke-width="3"/><path class="a" d="M480 50H600"/><rect class="x" x="600" width="230" height="100" rx="16"/><text class="n" x="636" y="43">time-conditioned U-Net</text><text class="s" x="664" y="73">predict εθ(xₜ,t)</text><path class="r" d="M715 100C700 180 400 180 390 102"/><path class="a" d="M830 50H950"/><rect class="x" x="950" width="180" height="100" rx="16"/><text class="n" x="982" y="58">synthetic EEG</text></g><text class="s" x="315" y="392">forward q: add noise</text><text class="s" x="616" y="392">reverse pθ: denoise</text><text class="f" x="60" y="458">Process redrawn from Ho, Jain &amp; Abbeel, DDPM (2020), arXiv:2006.11239; EEG adaptation follows the local implementation</text></svg>
