<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">EEGKANet architecture</title><desc id="d">An EEG convolutional encoder is followed by KAN layers with learnable spline functions on edges.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#1c2630"/><stop offset="1" stop-color="#31525e"/></linearGradient><style>.h{font:700 38px system-ui;fill:#fff}.s{font:20px system-ui;fill:#d7f7ff}.n{font:600 18px system-ui;fill:#fff}.x{fill:#274954;stroke:#75d7e8;stroke-width:2}.a{stroke:#75d7e8;stroke-width:4;marker-end:url(#m)}.q{stroke:#ffd166;stroke-width:3;fill:none}.f{font:15px system-ui;fill:#b8d9df}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#75d7e8"/></marker></defs><rect width="1200" height="500" rx="24" fill="url(#b)"/><text class="h" x="60" y="70">EEGKANet</text><text class="s" x="60" y="105">EEG feature extraction with learnable spline functions on connections</text><g transform="translate(65 180)"><rect class="x" width="180" height="115" rx="17"/><text class="n" x="48" y="64">EEG trial</text><path class="a" d="M180 58H260"/><rect class="x" x="260" width="230" height="115" rx="17"/><text class="n" x="305" y="49">EEGNet encoder</text><text class="s" x="311" y="81">compact features</text><path class="a" d="M490 58H570"/><rect class="x" x="570" width="310" height="115" rx="17"/><text class="n" x="667" y="35">KAN layer</text><circle cx="615" cy="78" r="12" fill="#75d7e8"/><circle cx="725" cy="78" r="12" fill="#75d7e8"/><circle cx="835" cy="78" r="12" fill="#75d7e8"/><path class="q" d="M627 78C650 30 685 126 713 78M737 78C765 25 797 130 823 78"/><text class="s" x="648" y="106">learned splines φ(x)</text><path class="a" d="M880 58H960"/><rect class="x" x="960" width="170" height="115" rx="17"/><text class="n" x="990" y="64">Class scores</text></g><text class="f" x="60" y="440">Composite architecture: EEGNet (Lawhern et al., 2018) + KAN (Liu et al., 2024, arXiv:2404.19756)</text><text class="f" x="60" y="466">Diagram follows the local EEGKANet implementation; it is not a figure from a standalone EEGKANet paper.</text></svg>
