<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">EEGNet architecture</title><desc id="d">EEGNet factorizes temporal filtering, spatial filtering, and separable convolution.</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#101638"/><stop offset="1" stop-color="#31376b"/></linearGradient><style>.h{font:700 38px system-ui;fill:white}.s{font:20px system-ui;fill:#d9dcff}.n{font:600 18px system-ui;fill:white}.x{fill:#242b5d;stroke:#9ba7ff;stroke-width:2}.a{stroke:#9ba7ff;stroke-width:4;marker-end:url(#m)}.f{font:15px system-ui;fill:#b9c0ed}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#9ba7ff"/></marker></defs><rect width="1200" height="500" rx="24" fill="url(#b)"/><text class="h" x="60" y="70">EEGNet</text><text class="s" x="60" y="105">Compact temporal–spatial convolution for EEG decoding</text><g transform="translate(55 195)"><rect class="x" width="150" height="105" rx="17"/><text class="n" x="38" y="48">EEG trial</text><text class="s" x="42" y="77">C × T</text><path class="a" d="M150 53H205"/><rect class="x" x="205" width="190" height="105" rx="17"/><text class="n" x="230" y="44">Temporal Conv</text><text class="s" x="253" y="76">1 × 64</text><path class="a" d="M395 53H450"/><rect class="x" x="450" width="195" height="105" rx="17"/><text class="n" x="468" y="44">Depthwise Conv</text><text class="s" x="505" y="76">C × 1</text><path class="a" d="M645 53H700"/><rect class="x" x="700" width="190" height="105" rx="17"/><text class="n" x="718" y="44">Separable Conv</text><text class="s" x="752" y="76">1 × 16</text><path class="a" d="M890 53H945"/><rect class="x" x="945" width="145" height="105" rx="17"/><text class="n" x="969" y="48">Classifier</text></g><text class="f" x="60" y="458">Architecture redrawn from Fig. 1, Lawhern et al., Journal of Neural Engineering (2018), doi:10.1088/1741-2552/aace8c</text></svg>
