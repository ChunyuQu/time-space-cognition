bio: |
  I am a PhD student in Neuro-Cognitive Psychology at LMU Munich, working with
  Prof. Dr. Zhuanghua Shi. I study how recent experiences shape what we perceive
  and decide, using computational models together with behavioral and neural data.
  My work focuses on serial dependence, the perception of time and space, and how
  history is retained and read out in the brain.

