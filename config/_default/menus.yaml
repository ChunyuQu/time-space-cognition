# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /
    weight: 10
  - name: Papers
    url: /#papers
    weight: 11
  - name: Research
    url: research/
    weight: 12
  - name: Reading Notes
    url: reading/
    weight: 13
  - name: Modeling Notes
    url: modeling/
    weight: 14
  - name: Experience
    url: experience/
    weight: 20
  - name: Projects
    url: projects/
    weight: 30

# Footer columns (used by the `columns` footer style).
# Top-level items become column headings; items with a `parent` become their links.
