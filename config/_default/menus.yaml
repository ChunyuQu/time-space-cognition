  - name: Publications
    url: publications/
    weight: 20
  - name: Projects
    url: projects/
    weight: 30
  - name: Experience
    url: experience/
    weight: 40
  - name: Reading Notes
    url: reading/
    weight: 50
  - name: Modeling Notes
