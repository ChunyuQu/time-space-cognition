# Site configuration for time-space-cognition.com
# Plain Hugo: no theme module, no template framework. Layouts and content are
# the source of truth, and the design mirrors the previous site exactly.

baseURL: 'https://time-space-cognition.com/'
locale: en-us
defaultContentLanguage: en
title: 'Chunyu Qu · Cognition and Computation'
enableRobotsTXT: true
enableGitInfo: false
summaryLength: 30
timeout: 600000

# The site has no taxonomies.
disableKinds:
  - taxonomy
  - term

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  author: Chunyu Qu
  description: 'Research on serial dependence, perception of time and space, and computational neuroscience'
  role: 'PhD Student · Neuro-Cognitive Psychology'
  affiliation: 'LMU Munich'
  tagline: 'How does the brain carry one moment into the next? I model how recent experience shapes time, space, and choice—and trace these dynamics in behavior and the brain.'
